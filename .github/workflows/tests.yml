name: Python Tests and Streamlit Smoke Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install app and test dependencies
        run: python -m pip install -r cloud/requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q app.py face_core.py download_models.py cloud tests
      - name: Unit and Streamlit UI tests
        run: python -m pytest -q tests
