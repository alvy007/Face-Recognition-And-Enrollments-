name: Python Unit Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test dependencies
        run: python -m pip install pytest numpy opencv-python-headless Pillow "cryptography>=43,<48"
      - name: Syntax check
        run: python -m compileall -q app.py face_core.py download_models.py cloud tests
      - name: Unit tests
        run: python -m pytest -q tests
