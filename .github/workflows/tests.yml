name: Python Unit Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest numpy opencv-python-headless "cryptography>=43,<48"
      - name: Syntax check
        run: python -m compileall -q app.py download_models.py cloud face_core.py
      - name: Unit tests
        run: python -m pytest -q tests
